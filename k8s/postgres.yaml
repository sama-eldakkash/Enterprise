apiVersion: apps/v1
kind: Deployment

metadata:
  name: workhub-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: workhub-postgres

  template:
    metadata:
      labels:
        app: workhub-postgres

    spec:
      containers:
        - name: postgres

          image: postgres:15

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: workhub

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: password
---
apiVersion: v1
kind: Service

metadata:
  name: workhub-postgres

spec:
  selector:
    app: workhub-postgres

  ports:
    - port: 5432
      targetPort: 5432