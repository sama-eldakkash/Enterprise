apiVersion: apps/v1
kind: Deployment

metadata:
  name: workhub-rabbitmq

spec:
  replicas: 1

  selector:
    matchLabels:
      app: workhub-rabbitmq

  template:
    metadata:
      labels:
        app: workhub-rabbitmq

    spec:
      containers:
        - name: rabbitmq

          image: rabbitmq:3-management

          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service

metadata:
  name: workhub-rabbitmq

spec:
  selector:
    app: workhub-rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672